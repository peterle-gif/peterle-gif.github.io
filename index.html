<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FamilySpot</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#BFE4FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FamilySpot">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;700;800&display=swap">
<style>
:root{--bg:#F5F3FF;--card:#fff;--ink:#1B1740;--mu:#5E5A85;--bd:#1B1740;--sh:#1B1740;--hero:#BFE4FF;--sun:#FFC531;--cor:#FF7A59;--mint:#3DD9B0;--sky:#8AC8FF;--grape:#A48BFF;--chip:#E6E1FF;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14112E;--card:#221D4D;--ink:#F3F0FF;--mu:#B1ABDD;--bd:#7D72E8;--sh:#07051A;--hero:#2B2570;--chip:#2E2866}}
:root[data-theme="dark"]{--bg:#14112E;--card:#221D4D;--ink:#F3F0FF;--mu:#B1ABDD;--bd:#7D72E8;--sh:#07051A;--hero:#2B2570;--chip:#2E2866}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Nunito,system-ui,sans-serif}
h1,h2,h3,.f{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:600;margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--grape);outline-offset:2px}
.mu{color:var(--mu);font-size:14px}
.view{display:none;padding-bottom:120px}.view.on{display:block}
.pad{padding:0 16px}
.hero{background:var(--hero);border-bottom:2px solid var(--bd);border-radius:0 0 30px 30px;padding:16px 16px 0;overflow:hidden}
.brand{display:flex;align-items:center;gap:8px;font:700 20px Fredoka,sans-serif}
.hero h1{font-size:32px;line-height:1.15;margin:14px 0 14px}
.sign,mark{display:inline-block;background:#FFD21E;color:#111;padding:0 12px;border:3px solid #111;border-radius:8px;box-shadow:inset 0 0 0 2px #FFD21E,inset 0 0 0 3.5px #111,0 0 0 3px #fff;font:800 1em Nunito,sans-serif;line-height:1.3}
.sign.out{position:relative;font-size:20px;padding:2px 14px}.sign.out::after{content:"";position:absolute;left:-6%;right:-6%;top:50%;border-top:4px solid #111;transform:rotate(-14deg)}
.pills{display:inline-flex;gap:2px;padding:3px;background:var(--card);border:2px solid var(--bd);border-radius:999px}
.pills button{padding:8px 16px;min-height:40px;border-radius:999px;font-weight:800}
.pills button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.hero svg.land{display:block;width:calc(100% + 32px);margin:6px -16px 0}
.sec{font-size:21px;margin:22px 16px 10px}
.tiles{display:flex;gap:10px;overflow-x:auto;padding:0 16px 8px;scrollbar-width:none}.tiles::-webkit-scrollbar{display:none}
.tile{flex:none;width:94px;display:block;text-align:center;text-decoration:none;color:#1B1740;font-weight:800;font-size:13px;padding:10px 2px;border:2px solid var(--bd);border-radius:18px;box-shadow:0 3px 0 var(--sh)}
.tile b{display:grid;place-items:center;width:46px;height:46px;margin:0 auto 6px;font-size:26px;line-height:1;background:#fff;border:2px solid #1B1740;border-radius:50%}
.tile:active,.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--sh)}
.sc{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 8px;scrollbar-width:none}.sc::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid var(--bd);border-radius:999px;padding:6px 14px;min-height:40px;font-weight:700;background:var(--card)}
.chip.on{background:var(--ink);color:var(--bg)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.cnt{margin:6px 16px 12px}
.card{background:var(--card);border:2px solid var(--bd);border-radius:22px;box-shadow:0 4px 0 var(--sh);margin:0 0 16px}
.pl{padding:14px}
.top{display:flex;gap:12px;align-items:center;text-align:left;width:100%}
.bd{width:50px;height:50px;border-radius:16px;border:2px solid var(--bd);display:grid;place-items:center;font-size:26px;flex:none;color:#1B1740}
.tx{display:block;min-width:0}.tx h3{font-size:19px;line-height:1.2}
.hint{margin:12px 0 2px}.dots{display:flex;align-items:center;gap:4px;margin:12px 0 2px}.dots .mu{margin-left:6px}
.d{width:13px;height:13px;border-radius:50%;border:2px solid var(--bd);display:inline-block}.d.ja{background:var(--mint)}.d.nein{background:var(--cor)}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}.pl .acts .btn{flex:1}.chev{margin-left:auto;font-size:26px;font-weight:800;color:var(--mu);padding-left:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border:2px solid var(--bd);border-radius:14px;background:var(--card);font-weight:800;text-decoration:none;box-shadow:0 3px 0 var(--sh);color:var(--ink)}
.btn.dark{background:var(--ink);color:var(--bg)}.btn.on{background:var(--mint);color:#1B1740}
.wide{display:flex;width:100%;margin-top:12px}
.vh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:20px 16px 12px}.vh h2{font-size:30px}
.today{padding:16px;margin:0 0 20px}.today .f{font-size:19px;margin-bottom:10px}
.idea{margin-top:14px;padding:16px;border:2px solid var(--bd);border-radius:18px;color:#1B1740}
.idea h3{font-size:24px;line-height:1.2}.idea .mu{color:#1B1740;opacity:.8}.idea small{font-weight:800;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.tl{list-style:none;margin:0 0 14px;padding:0}
.tl li{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:10px 12px;margin-bottom:10px;box-shadow:0 3px 0 var(--sh)}
.tl li>div{flex:1;min-width:0}.tl b{display:block}
.num{width:34px;height:34px;border-radius:50%;background:var(--sun);color:#1B1740;border:2px solid var(--bd);display:grid;place-items:center;font-weight:800;flex:none}
.mv{display:flex;gap:4px}.mv button{width:38px;height:42px;border:2px solid var(--bd);border-radius:10px}
.empty{padding:18px}.empty p{margin:6px 0 12px}
.ev{display:flex;gap:12px;padding:12px;align-items:flex-start}.ev h3{font-size:18px}.ev>div{min-width:0}
.date{flex:none;width:58px;text-align:center;background:var(--sun);color:#1B1740;border:2px solid var(--bd);border-radius:14px;padding:6px 0;font-weight:800;font-size:12px}
.date b{display:block;font:600 24px Fredoka,sans-serif}
.pf{padding:16px}.pf .f{font-size:19px}.sh3{font-size:18px;margin:18px 0 6px}
.bar{height:16px;border:2px solid var(--bd);border-radius:999px;background:var(--chip);overflow:hidden;margin:8px 0 2px}.bar i{display:block;height:100%;background:var(--mint)}
.note{margin:0 4px 16px}
.nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;gap:4px;padding:6px;background:var(--card);border:2px solid var(--bd);border-radius:26px;box-shadow:0 4px 0 var(--sh)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:54px;border-radius:20px;font-size:12px;font-weight:800;color:var(--mu);justify-content:center}
.nav button[aria-current="page"]{background:var(--sun);color:#1B1740}
.nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ov{position:fixed;inset:0;z-index:40;background:rgba(10,8,30,.6);display:none}.ov.on{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--bg);border:2px solid var(--bd);border-bottom:0;border-radius:30px 30px 0 0;padding:18px 16px calc(28px + env(safe-area-inset-bottom,0px))}
.x{float:right;width:44px;height:44px;border:2px solid var(--bd);border-radius:50%;background:var(--card)}
.sheet h2{font-size:26px;margin:10px 0 2px}.sheet .bd{width:60px;height:60px;font-size:32px}
.frow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;font-weight:700;font-size:15px}
.tri{display:flex;gap:4px;flex:none}.tri button{min-width:46px;min-height:40px;border:2px solid var(--bd);border-radius:12px;font-weight:800;background:var(--card)}
.tri .s.ja{background:var(--mint);color:#1B1740}.tri .s.nein{background:var(--cor);color:#1B1740}.tri .s.unbekannt{background:var(--chip)}
.st{display:flex;flex:none}.st button{font-size:28px;min-width:36px;min-height:40px;color:var(--chip);-webkit-text-stroke:1.5px var(--bd)}.st button.on{color:var(--sun)}
.fld{display:block;margin:10px 0;font-weight:700;font-size:14px}
input,select,textarea{display:block;width:100%;margin-top:6px;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:10px;min-height:46px}textarea{min-height:80px}
.sheet h2 .sign{font-size:22px;padding:2px 12px}
.st2{display:inline-block;font-size:12px;font-weight:800;padding:2px 10px;border:2px solid var(--bd);border-radius:999px;margin:8px 6px 0 0;color:#1B1740}.st2.ok{background:var(--mint)}.st2.warn{background:var(--cor)}.st2.old{background:var(--sun)}.st2.none{background:var(--chip);color:var(--ink)}
.tri .s.ja.bad{background:var(--cor)}.tri .s.nein.bad{background:var(--mint)}
.pk{display:flex;gap:12px;align-items:center;padding:6px 0;font-weight:700}.pk input{display:inline-block;width:26px;min-height:26px;height:26px;margin:0;accent-color:#3DD9B0}
.ctl{display:flex;gap:10px}.ctl .fld{flex:1;min-width:0;margin:6px 0}
.tl select{width:auto;min-height:36px;padding:4px 8px;margin-top:4px}.tm{display:block;font-weight:800}
.pl .acts a.btn,.pl .acts button.btn{min-width:0}
.pl{position:relative;overflow:hidden;padding-left:24px}.pl::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--cc);border-right:2px solid var(--bd)}
.tile small{display:block;font-weight:700;opacity:.7;font-size:11px;margin-top:2px}
.opt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:12px 6px;min-height:84px;border:2px solid var(--bd);border-radius:18px;background:var(--card);font-weight:800;font-size:14px;text-align:center;box-shadow:0 3px 0 var(--sh)}.opt b{font-size:28px;line-height:1.1}
button.opt.on{background:var(--mint);color:#1B1740;transform:translateY(2px);box-shadow:0 1px 0 var(--sh)}
.og{display:grid;gap:10px;margin:8px 0 14px}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.pfh{background:var(--grape);color:#1B1740;padding:18px;margin-bottom:6px}.pfh h2{font-size:27px}.pfh p{margin:6px 0 10px}
.bdg{opacity:.45;box-shadow:none}.bdg.on{opacity:1;background:var(--sun);color:#1B1740;box-shadow:0 3px 0 var(--sh)}.opt small{font-size:11px;font-weight:700}.bdg.on small{color:#1B1740}
.pre{white-space:pre-wrap;word-break:break-word;font:14px/1.5 ui-monospace,Menlo,monospace;margin:0}.pad2{padding:16px}
.fab{position:fixed;right:16px;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:19;background:var(--cor);color:#1B1740;border:2px solid var(--bd);border-radius:999px;min-height:52px;padding:0 20px;font-weight:800;font-size:16px;box-shadow:0 4px 0 var(--sh)}.fab:active{transform:translateY(2px);box-shadow:0 2px 0 var(--sh)}
.pad .sc{margin:0 -16px 6px}
#sg{display:flex;width:100%}#sg button{flex:1;padding:8px 6px;font-size:15px}
.rph{display:block;max-width:100%;max-height:170px;border-radius:12px;border:2px solid var(--bd);margin:6px 0}
.more:not(.end){-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 44px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 44px),transparent)}
.fbar{display:flex;align-items:center;gap:12px;margin:2px 16px 12px}.fbar .mu{min-width:0}
.rg.pills{border:0;background:none;padding:0}.citybtn{display:flex;align-items:center;gap:10px;font-weight:800;min-height:44px}
.hero .citybtn{border:2px solid var(--bd);border-radius:999px;padding:0 18px;background:var(--card)}.hero .citybtn .sign{display:none}
.toast{position:fixed;left:16px;right:16px;top:calc(12px + env(safe-area-inset-top,0px));z-index:60;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 16px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s}.toast.on{opacity:1}
.favb{flex:none!important;width:52px;padding:0!important;font-size:22px;color:var(--mu)}.favb.on{background:var(--cor);color:#1B1740}
.tour{padding:16px}.tour h3{font-size:19px}.tour .row{margin:8px 0}
</style>
</head>

<section class="view on" id="v0">
<header class="hero">
<div class="brand"><svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="10" fill="#A48BFF" stroke="#1B1740" stroke-width="2"/><path d="M16 25s-6-5.5-6-10a6 6 0 0112 0c0 4.500-6 10-6 10z" fill="#FFC531" stroke="#1B1740" stroke-width="2"/><circle cx="16" cy="15" r="2.200" fill="#1B1740"/></svg>FamilySpot</div>

<div class="sc" id="cats"></div>
<div id="fl" hidden></div>
<div class="fbar"><button class="chip" id="fb" data-filter>⚙ Filter</button><span class="mu" id="cnt"></span></div>
<div class="pad" id="list"></div>
</section>

<section class="view" id="v1">
<div class="vh"><h2>Heute</h2><div class="pills rg" role="group" aria-label="Region"></div></div>

<div id="plan"></div>
</div>
</section>

<section class="view" id="v2">
<div class="vh"><h2>Erleben</h2></div>

</section>

<section class="view" id="v3">

<div class="pad" id="pf"></div>

<button data-tab="1"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.900 4.900l1.400 1.400M17.700 17.700l1.400 1.400M4.900 19.100l1.400-1.400M17.700 6.300l1.400-1.400"/></svg>Heute</button>
<button data-tab="2"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Erleben</button>
<button data-tab="3"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Profil</button>
</nav>
